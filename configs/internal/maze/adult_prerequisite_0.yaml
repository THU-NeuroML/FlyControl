vec_env: subproc
env:
  env_id: Ant-v5
  friction_values:
  - 1.0
  steps_per_context: 1000000000
  cycle: false
policy:
  name: connectome_rate
  actor_kwargs:
    dt: 0.01
    tau_init: 0.02
    use_lora: false
    input_target: sensory
  value_hidden:
  - 256
  - 256
  value_activation: relu
  log_std_init: -1.0
connectome:
  species: adult
  kind: original
  adult_dir: inputs/flywire783
  chunksize: 250000
  min_syn_count: 1
  normalization: row_l1
  global_gain: 1.0
  sensory_selector:
    source: classification
    field: flow
    include:
    - afferent
  output_selector:
    source: classification
    field: super_class
    include:
    - motor
  polarity:
    unknown_action: zero
    nt_signs:
      ACH: 1.0
      GLUT: 1.0
      GABA: -1.0
      DA: 1.0
      SER: 1.0
      OCT: 1.0
ppo:
  total_timesteps: 3000000
  n_envs: 4
  n_steps: 512
  seq_len: 64
  n_epochs: 10
  n_minibatches: 4
  gamma: 0.99
  lam: 0.95
  clip_range: 0.2
  vf_clip_range: 0.2
  lr: 0.0003
  vf_coef: 0.5
  ent_coef: 0.0
  max_grad_norm: 0.5
  normalize_reward: true
  normalize_observation: true
  observation_clip: 10.0
  rollout_heartbeat: 128
resolved_vec_env: subproc
compatibility:
  environment: Ant-v5
  reference_environment: SlipperyAnt-v3
  protocol: floor-friction intervention ported to native mujoco
