algorithm: antmaze_teacher_distillation
observation_clip: 10.0
env:
  class_path: body_control.env.AntMazeTransferEnv
  env_id: AntMaze_UMaze-v5
  goal_feature_mode: world
  continuing_task: false
navigation:
  waypoint_planner: official_grid_waypoints
evaluation:
  action_smoothing: 0.8
teacher:
  source: Farama-Antmaze-Dataset-Generation
  training_steps: 8000000
  checkpoint_sha256: 1b835cc5185756c5af8cd0720dae0e4895efcec48ee577c450d4a5a633fb953e
policy:
  name: connectome_rate
  actor_kwargs:
    dt: 0.01
    tau_init: 0.02
    use_lora: false
    input_target: sensory
    goal_adapter_hidden:
    - 256
    - 128
    goal_adapter_features: 109
  value_hidden:
  - 256
  - 256
  value_activation: relu
connectome:
  species: adult
  kind: original
  adult_dir: inputs/flywire783
  chunksize: 250000
  min_syn_count: 1
  normalization: row_l1
  global_gain: 1.0
  sensory_selector:
    source: classification
    field: flow
    include:
    - afferent
  output_selector:
    source: classification
    field: super_class
    include:
    - motor
  polarity:
    unknown_action: zero
    nt_signs:
      ACH: 1.0
      GLUT: 1.0
      GABA: -1.0
      DA: 1.0
      SER: 1.0
      OCT: 1.0
imitation:
  demonstration_steps: 40000
  dagger_steps: 30000
  dagger_iterations: 1
  updates_per_stage: 10000
  batch_size: 32
  burn_in: 8
  learning_rate: 0.0003
  gradient_clip: 1.0
  actor_train_mode: goal_adapter_only
  goal_input_features: 4
  loss_space: pre_tanh
  checkpoint_interval_updates: 500
