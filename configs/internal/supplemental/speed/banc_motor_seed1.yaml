vec_env: subproc
policy:
  actor_kwargs:
    dt: 0.01
    input_target: sensory
    mode: rate
    tau_init: 0.02
    use_lora: false
  log_std_init: -0.5
  name: connectome_cfc
  value_hidden:
  - 128
  - 128
connectome:
  banc_dir: inputs/banc626
  chunksize: 250000
  global_gain: 1.0
  kind: original
  min_syn_count: 1
  normalization: row_l1
  output_selector:
    field: super_class
    include:
    - motor
  polarity:
    unknown_action: zero
  randomize_seed: 0
  sensory_selector:
    field: flow
    include:
    - afferent
  species: banc
env:
  decision_interval: 100
  flip_penalty: 1000.0
  max_correction: 10.0
  max_time: 1.5
  observation_mode: proprio_task
  terrain_seeds:
  - 0
  - 1
  - 2
  - 3
  terrains:
  - flat
  timestep: 0.0001
  command_adapter_config:
    frequency_bounds:
    - 0.25
    - 2.0
    k_drive: 0.75
    k_drive_step: 1.0
    k_step: 0.75
    step_bounds:
    - 0.4
    - 2.0
    continuous_gait: true
    slow_duty_factor: 0.72
    fast_duty_factor: 0.58
    slow_ipsilateral_lag_cycles: 0.3333333333333333
    fast_ipsilateral_lag_cycles: 0.5
    swing_duration_s: 0.035
    base_frequency_hz: 12.0
    gait_smoothing_alpha: 0.005
  speed_filter_alpha: 0.25
  speed_heading_rate_weight: 0.25
  speed_target_scale_mm_s: 20.0
  speed_targets_mm_s:
  - 8.0
  - 16.0
  action_mode: command2
  task: speed_control
  speed_target_sampling: uniform
  speed_target_range_mm_s:
  - 8.0
  - 16.0
ppo:
  clip_range: 0.2
  ent_coef: 0.0
  gamma: 0.99
  lam: 0.95
  lr: 0.0001
  max_grad_norm: 0.5
  n_envs: 16
  n_epochs: 2
  n_minibatches: 5
  n_steps: 160
  normalize_reward: true
  rollout_heartbeat: 32
  seq_len: 32
  total_timesteps: 499200
  vf_clip_range: 0.2
  vf_coef: 0.5
  separate_rng_streams: true
  initialization_seed: 1
  environment_seed: 11000
  policy_sampling_seed: 20001
  minibatch_seed: 30001
  initial_hidden_mode: zero
seed: 1
initialization:
  critic_state_from: initialization/critic_seed1.pt
resume_policy: restart_only
