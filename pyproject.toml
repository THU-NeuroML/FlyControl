[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flycontrol"
version = "0.1.0"
description = "From-scratch connectome control experiments"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy==2.0.2", "pandas==2.3.3", "scipy==1.15.3",
  "matplotlib==3.10.9", "torch==2.11.0", "mujoco==3.2.7",
  "gymnasium==1.2.3", "gymnasium-robotics==1.4.2",
  "dm-control==1.0.27", "PyYAML==6.0.3", "imageio==2.37.3",
  "opencv-python==4.13.0.92", "stable-baselines3==2.8.0",
  "sb3-contrib==2.8.0", "numba==0.60.0", "tqdm==4.67.3", "dm-tree==0.1.8",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
notebook = ["jupyterlab>=4.5,<5", "ipykernel>=7,<8"]

[project.scripts]
flycontrol = "flycontrol.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flycontrol"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "flycontrol/configs"

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "scripts", "notebooks", "tests", "docs", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
